[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zap-uninstaller"
version = "0.2.0"
description = "A terminal-native, agent-friendly app uninstaller — finds and removes an app plus all of its leftover files. Cross-platform (macOS + Linux), zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "zap contributors" }]
keywords = ["uninstaller", "appzapper", "cleanup", "macos", "cli", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "mypy>=1.8"]

[project.urls]
Homepage = "https://github.com/waltspence/frank_zappa"
Repository = "https://github.com/waltspence/frank_zappa"

[project.scripts]
zap = "zap.cli:main"
zap-gui = "zap.gui:main"

[tool.setuptools]
packages = ["zap", "zap.core", "zap.platforms"]

[tool.setuptools.package-data]
zap = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
